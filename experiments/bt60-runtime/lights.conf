# BT60 v2 has backlight and RGB underglow on the PCB (Oreo); boards without LEDs simply stay dark.
# Built in, but the keyboard-side "use" switches start OFF (RYONG_RUNTIME_SETTINGS_LIGHTS_DEFAULT_USE=n).
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_ON_START=n
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
# Full range; the runtime "maximum brightness" setting limits it instead.
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=100
