# Opt-in CI experiment. No installable images are uploaded.
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_BLE_SETTLE_MS=1500
# Ryong: ask the host who it is (Device Information "Apple Inc." + model, Apple services). The earlier
# probe hung after the first answer (callback never advanced) - rewritten with a watchdog, started
# only after the host's discovery settled; a refused read must never trigger a security change.
CONFIG_ZMK_OS_DETECTION_BLE_GATT_CLIENT_PROBE=y
CONFIG_BT_ATT_RETRY_ON_SEC_ERR=n
CONFIG_ZMK_OS_DETECTION_LAYER_AUTO_SWITCH=n
CONFIG_RYONG_HOST_LAYOUT=y
CONFIG_RYONG_HOST_LAYOUT_SETTLE_MS=2000
