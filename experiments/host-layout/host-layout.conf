# Opt-in CI experiment. No installable images are uploaded.
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y
CONFIG_ZMK_OS_DETECTION_BLE_SETTLE_MS=1500
# Ryong: the "ask the host" probe stays OFF. macOS did not answer it (bench 2026-11-03), and asking the
# host while it sets up a fresh pairing is a suspect for keys staying dead until a restart. Detection
# uses the read pattern (macOS: PnP ID without GAP Appearance -> Apple; Windows reads Appearance).
CONFIG_ZMK_OS_DETECTION_BLE_GATT_CLIENT_PROBE=n
CONFIG_ZMK_OS_DETECTION_LAYER_AUTO_SWITCH=n
CONFIG_RYONG_HOST_LAYOUT=y
CONFIG_RYONG_HOST_LAYOUT_SETTLE_MS=2000
