# Keyboard-side settings (lights, deep sleep) changed from the web app without a rebuild.
CONFIG_RYONG_RUNTIME_SETTINGS=y
# ZMK's own deep sleep stays compiled in (it provides the power-off path) but is pushed far out;
# the runtime setting (1-1440 min, or off) decides when to sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2000000000
# Studio over Bluetooth: more controller TX buffers so a settings reply can go out several packets per
# connection event (default 3). Small RAM cost.
CONFIG_BT_BUF_ACL_TX_COUNT=8
# Studio unlock must not start connectable advertising while connected: the web page reaches the
# keyboard over WebHID on the existing link, and advertising would let another paired computer
# connect mid-session.
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=n
# Studio over Bluetooth: long radio packets (Data Length Extension, standard since Bluetooth 4.2) so a
# 62-byte Studio report leaves in one packet instead of three 27-byte pieces. Requested only while
# Studio is talking (hid_rpc_transport.c).
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
# One Bluetooth identity (address) per profile (src/ble_slots.c, slot i = identity i+1; identity 0 unused): a host only knows
# its own slot's address, so paired hosts nearby never jump at another slot's advertising.
CONFIG_BT_ID_MAX=6
# Startup work (Bluetooth identities, bond checks, every stored setting) runs in the main thread
# while settings load, and slot clearing in the system work queue: ZMK's 2048-byte stacks left no
# margin (a keyboard that hung at power-up). Larger stacks, and a stack that still runs over is
# caught by the MPU (a fatal error: modules/ryong-ble-profiles restarts the keyboard, and after
# three quick crashes opens the UF2 drive) instead of silently corrupting memory.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
CONFIG_HW_STACK_PROTECTION=y
