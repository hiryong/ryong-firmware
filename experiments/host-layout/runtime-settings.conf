# Keyboard-side settings (lights, deep sleep) changed from the web app without a rebuild.
CONFIG_RYONG_RUNTIME_SETTINGS=y
# ZMK's own deep sleep stays compiled in (it provides the power-off path) but is pushed far out;
# the runtime setting (1-1440 min, or off) decides when to sleep.
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=2000000000
# Studio over Bluetooth: more controller TX buffers so a settings reply can go out several packets per
# connection event (default 3). Small RAM cost.
CONFIG_BT_BUF_ACL_TX_COUNT=8
# Studio unlock must not start connectable advertising while connected: the web page reaches the
# keyboard over WebHID on the existing link, and advertising would let another paired computer
# connect mid-session.
CONFIG_ZMK_STUDIO_LOCK_BLE_DIRECT_ADVERTISING_ON_UNLOCK=n
