syntax = "proto3";

package cormoran.os_detection;

enum Os {
    OS_UNSPECIFIED = 0;
    OS_UNKNOWN = 1;
    OS_WINDOWS = 2;
    OS_MACOS = 3;
    OS_LINUX = 4;
    OS_IOS = 5;
    OS_ANDROID = 6;
}

message GetStateRequest {}

message SetBleOverrideRequest {
    uint32 profile_index = 1;
    Os os = 2; // OS_UNSPECIFIED or OS_UNKNOWN resets to AUTO
}

message UsbState {
    bool connected = 1;
    Os detected = 2;
}

// Ryong: what the host read while connecting (last connection since power-up), so a wrong guess
// can be explained and the classifier tuned from real captures.
message BleFingerprint {
    uint32 report_map = 1;
    uint32 hids_info = 2;
    uint32 report = 3;
    uint32 pnp_id = 4;
    uint32 appearance = 5;
    uint32 att_mtu = 6;
    uint32 conn_interval = 7; // 1.25 ms units
    Os classified = 8;
    bool kept_cached = 9;
    uint32 apple_probe = 10; // 0 no answer, 1 not Apple, 2 Mac, 3 iPhone/iPad (host's Device Information)
}

message BleProfileState {
    uint32 index = 1;
    bool bonded = 2;
    bool connected = 3;
    Os detected = 4;
    Os override = 5;
    Os effective = 6;
    BleFingerprint fingerprint = 7;
}

message StateResponse {
    UsbState usb = 1;
    repeated BleProfileState ble_profiles = 2;
    uint32 active_profile_index = 3;
    Os current_effective = 4;
}

message SetBleOverrideResponse { BleProfileState profile = 1; }

message ErrorResponse { string message = 1; }

message Request {
    oneof request_type {
        GetStateRequest get_state = 1;
        SetBleOverrideRequest set_ble_override = 2;
    }
}

message Response {
    oneof response_type {
        ErrorResponse error = 1;
        StateResponse state = 2;
        SetBleOverrideResponse set_ble_override = 3;
    }
}
