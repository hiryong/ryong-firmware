<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ryong-mark.svg" />
    <meta name="theme-color" content="#000000" />
    <link rel="preload" href="/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/pretendard/pretendardvariable-dynamic-subset.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Keys · ryong</title>
    <!-- Intro, first visit in a session: "ooo\" is typed on one line, then the letters move into the ryong mark.
         Any key, click or scroll skips it. Same timing and easing family as ryong.com's intro. -->
    <script>try{if(!sessionStorage.getItem('ryongKeyIntro')&&!matchMedia('(prefers-reduced-motion: reduce)').matches){document.documentElement.classList.add('ry-show-intro');}sessionStorage.setItem('ryongKeyIntro','1');}catch(e){}</script>
    <style>
      html, body { background: #000; }
      .ry-intro { display: none; }
      .ry-show-intro .ry-intro {
        position: fixed; inset: 0; z-index: 2147483647; background: #000;
        display: flex; align-items: center; justify-content: center; pointer-events: none;
        animation: ryIntroOut 0.45s cubic-bezier(0.7, 0, 0.3, 1) 2.55s forwards;
      }
      .ry-show-intro.ry-intro-skip .ry-intro { animation: ryIntroOut 0.3s ease forwards; }
      @keyframes ryIntroOut { to { opacity: 0; visibility: hidden; } }

      .ry-intro svg { overflow: visible; }
      /* The typed letters are the mark's own shapes at half size, so "o" and "\" always match.
         Typed on one line, then each one moves to its place in the mark and grows to full size. */
      .ry-intro .mk { opacity: 0; transform-box: fill-box; transform-origin: center;
        transform: translate(var(--dx), var(--dy)) scale(0.55);
        animation: ryKey 0.1s ease-out var(--t) forwards, ryFly 0.65s cubic-bezier(0.65, 0, 0.25, 1) var(--f) forwards; }
      .ry-intro .m1 { --dx: -12.27px; --dy: 17.73px; --t: 1s; --f: 1.75s; }
      .ry-intro .m2 { --dx: -26.29px; --dy: 17.73px; --t: 1.17s; --f: 1.8s; }
      .ry-intro .m3 { --dx: 27.73px; --dy: -16.29px; --t: 1.33s; --f: 1.85s; }
      .ry-intro .m4 { --dx: 13.71px; --dy: -16.29px; --t: 1.57s; --f: 1.9s; }
      @keyframes ryKey { from { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(0.47); } to { opacity: 1; transform: translate(var(--dx), var(--dy)) scale(0.55); } }
      @keyframes ryFly { from { transform: translate(var(--dx), var(--dy)) scale(0.55); } to { transform: none; } }

      /* the caret: Geist's own proportions (1px wide, ascent to descent around the typed line);
         blinks like a real caret (0.5 s on, 0.5 s off), stays on while typing, goes */
      .ry-intro .caret { animation: ryCaret 1.85s step-end forwards; }
      .ry-intro .caret rect { animation: ryBlink 1s step-end, ryCaretOut 0.1s ease 1.7s forwards; }
      @keyframes ryBlink { 0% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes ryCaretOut { to { opacity: 0; } }
      @keyframes ryCaret {
        0% { transform: translate(-8.1px, 0); }
        54.05% { transform: translate(11.9px, 0); }
        63.24% { transform: translate(31.9px, 0); }
        71.89% { transform: translate(51.9px, 0); }
        84.86% { transform: translate(71.9px, 0); }
        100% { transform: translate(71.9px, 0); }
      }
      /* dialogs sit in the browser's top layer, above any z-index: keep them out of sight until the intro leaves */
      .ry-show-intro dialog, .ry-show-intro dialog::backdrop { transition: opacity 0.6s ease; }
      .ry-show-intro:not(.ry-intro-out) dialog, .ry-show-intro:not(.ry-intro-out) dialog::backdrop { opacity: 0 !important; }
      @media (prefers-reduced-motion: reduce) { .ry-show-intro .ry-intro { display: none; } }
    </style>
  </head>
  <body>
    <div class="ry-intro" aria-hidden="true">
      <svg width="96" height="96" viewBox="-2 -2 68 68">
        <g class="caret"><rect x="-0.355" y="12" width="0.71" height="35.9" rx="0.355" fill="#FCFDFF" /></g>
        <g fill="#FCFDFF">
          <path class="mk m1" d="M14.17 4C19.78 4 24.34 8.56 24.34 14.17C24.34 19.78 19.78 24.34 14.17 24.34C8.56 24.34 4 19.78 4 14.17C4 8.56 8.56 4 14.17 4ZM14.17 0C6.35 0 0 6.35 0 14.17C0 21.99 6.35 28.34 14.17 28.34C21.99 28.34 28.34 21.99 28.34 14.17C28.34 6.35 22 0 14.17 0Z" />
          <path class="mk m2" d="M48.1934 4C53.8034 4 58.3634 8.56 58.3634 14.17C58.3634 19.78 53.8034 24.34 48.1934 24.34C42.5834 24.34 38.0234 19.78 38.0234 14.17C38.0234 8.56 42.5834 4 48.1934 4ZM48.1934 0C40.3634 0 34.0234 6.35 34.0234 14.17C34.0234 21.99 40.3734 28.34 48.1934 28.34C56.0134 28.34 62.3634 21.99 62.3634 14.17C62.3634 6.35 56.0234 0 48.1934 0Z" />
          <path class="mk m3" d="M14.17 38.0195C19.78 38.0195 24.34 42.5795 24.34 48.1895C24.34 53.7995 19.78 58.3595 14.17 58.3595C8.56 58.3595 4 53.7995 4 48.1895C4 42.5795 8.56 38.0195 14.17 38.0195ZM14.17 34.0195C6.34 34.0195 0 40.3695 0 48.1895C0 56.0095 6.35 62.3595 14.17 62.3595C21.99 62.3595 28.34 56.0095 28.34 48.1895C28.34 40.3695 21.99 34.0195 14.17 34.0195Z" />
          <path class="mk m4" d="M35.43 32.5974L32.6016 35.4258L60.9495 63.7737L63.7779 60.9453L35.43 32.5974Z" />
        </g>
      </svg>
    </div>
    <script>
      (function () {
        var h = document.documentElement;
        if (!h.classList.contains('ry-show-intro')) return;
        var ev = ['pointerdown', 'keydown', 'wheel', 'touchstart'];
        var out = setTimeout(function () { h.classList.add('ry-intro-out'); }, 2550);
        var skip = function () {
          ev.forEach(function (t) { window.removeEventListener(t, skip, true); });
          if (h.classList.contains('ry-intro-done')) return;
          clearTimeout(out);
          h.classList.add('ry-intro-skip', 'ry-intro-out');
        };
        ev.forEach(function (t) { window.addEventListener(t, skip, { capture: true, passive: true }); });
        setTimeout(function () { h.classList.add('ry-intro-done'); }, 3050);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
