syntax = "proto3";
package ryong.settings;

// Keyboard-side settings that previously needed a firmware rebuild.
message Empty {}

message Light {
    bool use = 1;            // feature switch: off = always dark, keys can't turn it on
    bool on_at_start = 2;    // lit when the keyboard starts
    uint32 brightness = 3;   // backlight: brightness; underglow: maximum brightness (0-100)
    bool usb_only = 4;       // dark on battery, lit again when USB power returns
}

// Bluetooth slot light on the backlight: blinks while a slot waits for a device, flashes once
// when a slot is cleared.
message Indicator {
    bool use = 1;
    uint32 brightness = 2;  // 1-100
    // Each signal can be switched off on its own (false = shown, so older pages keep them).
    bool hide_connected = 3;  // on for 1 s when the slot's computer connects
    bool hide_waiting = 4;    // slow blink while waiting for the slot's computer
    bool hide_pairing = 5;    // fast blink while an empty slot waits for a new computer
    bool hide_cleared = 6;    // one short flash when a slot is cleared
}

message Settings {
    bool sleep_enabled = 1;
    uint32 sleep_minutes = 2;  // 1-1440
    Light backlight = 3;
    Light underglow = 4;
    Indicator bt_indicator = 5;  // absent from older pages: kept unchanged
}

message Capabilities {
    bool backlight = 1;        // compiled in (the board may still have no LEDs)
    bool underglow = 2;
    uint32 sleep_max_minutes = 3;
    bool ble_update = 4;       // can restart into the bootloader's Bluetooth update mode (development)
    bool bt_indicator = 5;     // Bluetooth slot light built in
}

message State {
    Settings settings = 1;
    Capabilities caps = 2;
    bool backlight_on = 3;
    bool underglow_on = 4;
    bool usb_powered = 5;
    uint32 protocol_version = 6;
    string keyboard_name = 7;
    uint32 keyboard_name_max_bytes = 8;  // 0: this keyboard cannot be renamed
}

message LightPower {
    uint32 which = 1;  // 0 = backlight, 1 = underglow
    bool on = 2;
}

// The keyboard's name: Bluetooth (at once) and USB (from the next power-up or plug-in). Stored on
// the keyboard, so every computer sees it; firmware updates keep it.
message KeyboardName { string name = 1; }

message Status { bool ok = 1; uint32 error = 2; }

message Request {
    oneof request_type {
        Empty get_state = 1;
        Settings set = 2;
        LightPower power = 3;
        Empty ble_update = 4;   // restart into Bluetooth update mode (reply first, then restart)
        KeyboardName set_name = 5;
    }
}

message Response {
    oneof response_type {
        State state = 1;
        Status status = 2;
    }
}
