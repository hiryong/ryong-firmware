name: Independent native development app
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['apps/keys-ryong-runtime/src/**', 'apps/keys-ryong-runtime/package*.json', 'apps/keys-ryong-runtime/vite*.ts', 'experiments/runtime-client/**', 'apps/keys-ryong-runtime/src-tauri/**', 'tools/ryong-updater/**', '.github/workflows/native-app-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac-app:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/keys-ryong-runtime/src-tauri/target
          key: native-macos-${{ runner.arch }}-${{ hashFiles('apps/keys-ryong-runtime/src-tauri/Cargo.lock', 'tools/ryong-updater/Cargo.lock') }}
      - name: Install protocol compiler in runner
        run: command -v protoc || brew install protobuf
      - run: bash experiments/runtime-client/prepare.sh "$GITHUB_WORKSPACE/vendor/runtime-studio-client"
      - name: Build independent development app
        working-directory: apps/keys-ryong-runtime
        run: |
          npm ci
          npm run generate-data || { mkdir -p src/data; echo '{"tag_name":"","assets":[]}' > src/data/release-data.json; }
          npx tsc -p tsconfig.runtime.json
          npx tauri build --config src-tauri/tauri.dev-runtime.conf.json --bundles app
      - name: Ad-hoc signature verification
        run: codesign --verify --deep --strict "apps/keys-ryong-runtime/src-tauri/target/release/bundle/macos/Keys Ryong Development.app"
      - uses: actions/upload-artifact@v4
        with:
          name: keys-ryong-mac-development
          path: apps/keys-ryong-runtime/src-tauri/target/release/bundle/macos/*.app
# Separate bundle ID and ad-hoc signing. No production deployment, keys or firmware images.
