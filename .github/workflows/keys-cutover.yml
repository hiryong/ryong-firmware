# One-time move (2026-11-04, owner's decision): keys.ryong.com is served by this repository's web
# app (Pages project ryong-keys, deployed by keys-deploy.yml). The original Keys site's Pages
# project and keysbeta.ryong.com (Pages project ryong-keys-beta) are removed.
#   mode=plan     lists every Pages project and its domains, and the keys/keysbeta DNS records; changes nothing
#   mode=cutover  moves keys.ryong.com, removes keysbeta.ryong.com and deletes the two old projects.
#                 Needs old_project = the project plan showed holding keys.ryong.com, and confirm = keys.ryong.com
name: keys cutover (one-time)
on:
  push:  # registers the workflow (it is not on the default branch); a push only plans
    branches: [dev/keys-ryong-runtime]
    paths: ['.github/workflows/keys-cutover.yml']
  workflow_dispatch:
    inputs:
      mode: { description: "plan | cutover", required: true, type: choice, options: [plan, cutover], default: plan }
      old_project: { description: "Pages project that serves keys.ryong.com today (from plan)", required: false, default: "" }
      confirm: { description: "Type keys.ryong.com to allow cutover", required: false, default: "" }
permissions:
  contents: read
concurrency:
  group: keys-cutover
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MODE: ${{ inputs.mode || 'plan' }}
      OLD: ${{ inputs.old_project }}
      CONFIRM: ${{ inputs.confirm }}
      NEW: ryong-keys
      BETA: ryong-keys-beta
      ZONE: ryong.com
    steps:
      - name: Plan / cut over
        shell: bash
        run: |
          set -euo pipefail
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          A="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects"
          ok() { python3 -c 'import json,sys; d=json.load(sys.stdin); print("ok" if d.get("success") else "FAILED " + json.dumps(d.get("errors"))[:300])'; }
          echo "### Pages projects" | tee -a "$GITHUB_STEP_SUMMARY"
          api "$A" > /tmp/projects.json
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("/tmp/projects.json"))
          if not d.get("success"): print("cannot list projects:", d.get("errors")); raise SystemExit(1)
          for p in d["result"]:
              print(f"- `{p['name']}` ({p.get('subdomain')}): domains {', '.join(p.get('domains') or []) or '-'}; source {((p.get('source') or {}).get('config') or {}).get('repo_name', '-')}")
          PY
          zone=$(api "https://api.cloudflare.com/client/v4/zones?name=$ZONE" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          [ -n "$zone" ] || echo "- The token cannot read the $ZONE DNS zone: DNS records are changed by hand (see the end)." | tee -a "$GITHUB_STEP_SUMMARY"
          Z="https://api.cloudflare.com/client/v4/zones/$zone/dns_records"
          [ "$MODE" = cutover ] || { echo "Plan only: nothing changed."; exit 0; }

          [ "$CONFIRM" = keys.ryong.com ] || { echo "::error::confirm must be keys.ryong.com"; exit 1; }
          [ -n "$OLD" ] && [ "$OLD" != "$NEW" ] && [ "$OLD" != "$BETA" ] || { echo "::error::old_project must be the original site's project"; exit 1; }
          python3 -c 'import json,os,sys; d=json.load(open("/tmp/projects.json")); p=[x for x in d["result"] if x["name"]==os.environ["OLD"]]; sys.exit(0 if p and "keys.ryong.com" in (p[0].get("domains") or []) else 1)' \
            || { echo "::error::$OLD does not hold keys.ryong.com"; exit 1; }
          sub=$(api "$A/$NEW" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"]["subdomain"] if d.get("success") else "")')
          [ -n "$sub" ] || { echo "::error::$NEW does not exist yet: run keys deploy first"; exit 1; }
          echo "### Cutover" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- detach keys.ryong.com from $OLD: $(api -X DELETE "$A/$OLD/domains/keys.ryong.com" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- attach keys.ryong.com to $NEW: $(api -X POST "$A/$NEW/domains" -d '{"name":"keys.ryong.com"}' | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ -n "$zone" ]; then
          rid=$(api "$Z?name=keys.ryong.com" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          if [ -n "$rid" ]; then
            echo "- DNS keys → $sub: $(api -X PATCH "$Z/$rid" -d "{\"type\":\"CNAME\",\"name\":\"keys\",\"content\":\"$sub\",\"proxied\":true,\"comment\":\"ryong-firmware Keys\"}" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- DNS keys → $sub (new): $(api -X POST "$Z" -d "{\"type\":\"CNAME\",\"name\":\"keys\",\"content\":\"$sub\",\"proxied\":true,\"comment\":\"ryong-firmware Keys\"}" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          bid=$(api "$Z?name=keysbeta.ryong.com" | python3 -c 'import json,sys; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")')
          [ -z "$bid" ] || echo "- DNS keysbeta removed: $(api -X DELETE "$Z/$bid" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "- **DNS by hand** (Cloudflare → ryong.com → DNS): set the \`keys\` CNAME target to \`$sub\` (proxied), and delete the \`keysbeta\` record." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "- detach keysbeta.ryong.com: $(api -X DELETE "$A/$BETA/domains/keysbeta.ryong.com" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- delete project $BETA: $(api -X DELETE "$A/$BETA" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- delete project $OLD (the original Keys site): $(api -X DELETE "$A/$OLD" | ok)" | tee -a "$GITHUB_STEP_SUMMARY"
