name: Ryong60 compile validation
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['hardware/ryong60/**', 'modules/**', 'experiments/host-layout/runtime-settings.conf', 'experiments/dya-runtime/**', 'scripts/prepare_zmk.py', 'scripts/vendor_zmk.py', 'third_party/zmk/**', 'third_party/zmk-modules/**', 'scripts/runtime_defaults.py', 'scripts/secure_runtime_rpc.py', 'scripts/run_module_simulations.py', '.github/workflows/zmk-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, runtime]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare isolated workspace
        run: python3 scripts/prepare_zmk.py /tmp/ryong-build
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/ryong-build/zmk
            /tmp/ryong-build/zephyr
            /tmp/ryong-build/modules
            /tmp/ryong-build/tools
            /tmp/ryong-build/bootloader
          key: zmk-deps-${{ runner.os }}-${{ hashFiles('experiments/dya-runtime/west.yml', 'third_party/zmk/base.json', 'third_party/zmk-modules/**') }}
      - name: Resolve pinned dependencies
        working-directory: /tmp/ryong-build
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west forall -c 'git restore --source=HEAD --worktree --staged .'
          west zephyr-export
          python3 "$GITHUB_WORKSPACE/scripts/vendor_zmk.py" apply .
          west manifest --freeze --active-only > resolved-manifest.yml
      - name: Require Studio unlock in external modules
        if: matrix.variant == 'runtime'
        run: python3 scripts/secure_runtime_rpc.py /tmp/ryong-build
      - name: Compile exact Ryong60 target
        working-directory: /tmp/ryong-build
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          EXTRA=()
          if [ "$VARIANT" = runtime ]; then EXTRA=("-DZMK_EXTRA_MODULES=/tmp/ryong-build/board;$GITHUB_WORKSPACE/modules/ryong-holdtap;$GITHUB_WORKSPACE/modules/ryong-ble-profiles;$GITHUB_WORKSPACE/modules/ryong-runtime-settings;$GITHUB_WORKSPACE/modules/ryong-named-macro" "-DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/experiments/dya-runtime/ryong60-runtime.conf;$GITHUB_WORKSPACE/experiments/host-layout/ble-profiles.conf;$GITHUB_WORKSPACE/experiments/host-layout/runtime-settings.conf" "-DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/experiments/dya-runtime/ryong60-runtime.overlay;/tmp/ryong-build/runtime-defaults.overlay"); python3 "$GITHUB_WORKSPACE/scripts/runtime_defaults.py" "$GITHUB_WORKSPACE/hardware/ryong60/boards/ryong/ryong60/ryong-behaviors.dtsi" /tmp/ryong-build/runtime-defaults.overlay "$GITHUB_WORKSPACE/hardware/ryong60/boards/ryong/ryong60/ryong-behaviors.json"; fi
          west build -s zmk/app -d build -b ryong60//zmk -S studio-rpc-usb-uart -- -DZMK_CONFIG=/tmp/ryong-build/config -DZMK_EXTRA_MODULES=/tmp/ryong-build/board "${EXTRA[@]}"
      - name: Install native simulator compiler
        if: matrix.variant == 'runtime'
        run: apt-get update && apt-get install -y gcc-multilib g++-multilib
      - name: Run module event simulations
        if: matrix.variant == 'runtime'
        run: python3 scripts/run_module_simulations.py /tmp/ryong-build
      - name: Collect diagnostic reports only
        if: always()
        working-directory: /tmp/ryong-build
        run: |
          mkdir -p reports
          cp resolved-manifest.yml reports/ || true
          for f in .config zephyr.dts zmk.map; do
            if [ -f "build/zephyr/$f" ]; then cp "build/zephyr/$f" "reports/${f#.}"; fi
          done
          if [ -f build/zephyr/zmk.elf ]; then
            west build -d build -t rom_report > reports/rom.txt
            west build -d build -t ram_report > reports/ram.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-${{ matrix.variant }}
          path: /tmp/ryong-build/reports
# Deliberately never upload UF2, HEX, BIN or ELF: not hardware approved.

