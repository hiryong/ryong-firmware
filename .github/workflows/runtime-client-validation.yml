name: Runtime client compatibility
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['experiments/runtime-client/**', 'scripts/pack_runtime_preview.py', 'apps/keys-ryong-runtime/**', 'apps/keys-ryong/vite.runtime.config.ts', 'apps/keys-ryong/tsconfig.runtime.json', '.github/workflows/runtime-client-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Build pinned custom client
        run: bash experiments/runtime-client/prepare.sh "$GITHUB_WORKSPACE/vendor/runtime-studio-client"
      - name: Generate MIT runtime protocol codecs
        run: |
          mkdir -p generated-runtime-proto
          protoc --plugin=protoc-gen-ts_proto="$GITHUB_WORKSPACE/vendor/runtime-studio-client/node_modules/.bin/protoc-gen-ts_proto" --ts_proto_out=generated-runtime-proto --ts_proto_opt=env=browser,esModuleInterop=true --proto_path=experiments/runtime-client/proto experiments/runtime-client/proto/*.proto
          cp generated-runtime-proto/{runtime_tapdance,holdtap}.ts apps/keys-ryong-runtime/src/ryong/runtime/proto/
      - uses: actions/upload-artifact@v4
        with:
          name: generated-runtime-protocol
          path: generated-runtime-proto
      - name: Install preserved web app
        working-directory: apps/keys-ryong
        run: npm ci
      - name: Verify and build original client variant
        working-directory: apps/keys-ryong
        run: |
          python3 ../verify_baseline.py
          node tests/runtime-read.test.mjs
          bash scripts/ryong-build.sh
      - name: Install editable runtime app
        working-directory: apps/keys-ryong-runtime
        run: |
          npm ci
          node tests/runtime-device.test.mjs
          node tests/runtime-model.test.mjs
          mkdir -p src/data
          cp ../keys-ryong/src/data/release-data.json src/data/release-data.json
      - name: Build custom client variant without changing original app dependencies
        working-directory: apps/keys-ryong-runtime
        run: |
          npx tsc -p tsconfig.runtime.json
          npx vite build --config vite.runtime.config.ts --outDir dist-runtime
      - name: Build standalone preview with device transports disabled
        working-directory: apps/keys-ryong-runtime
        run: |
          npx vite build --config vite.offline.config.ts --outDir dist-offline
          python3 ../../scripts/pack_runtime_preview.py dist-offline offline-preview/Keys-Ryong-Runtime-Preview.html
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-offline-preview
          path: apps/keys-ryong-runtime/offline-preview
      - name: Install browser QA in the runner only
        run: |
          npm install --prefix /tmp/ryong-ui-qa playwright@1.56.1
          node /tmp/ryong-ui-qa/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify existing editor in a real browser
        working-directory: apps/keys-ryong-runtime
        env:
          RYONG_PLAYWRIGHT: /tmp/ryong-ui-qa/node_modules/playwright/index.mjs
        run: node tests/runtime-ui.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-ui-verification
          path: apps/keys-ryong-runtime/ui-verification
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-client-compatibility
          path: |
            vendor/runtime-studio-client/lib
            vendor/runtime-studio-client/LICENSE
            apps/keys-ryong-runtime/dist-runtime
# No deployment, no production credentials, no firmware binaries.
