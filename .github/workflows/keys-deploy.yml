# Deploys the web app (and its /admin) to the Cloudflare Worker "keys" (static assets +
# worker/index.ts for /api/admin), served at keys.ryong.com (custom domain attached in the dashboard;
# moved from the Pages project ryong-keys on 2026-11-09). Does nothing until the Cloudflare secrets exist.
# Uploads the static app plus ONLY the /api/admin functions (admin-functions/); the
# original app's GitHub sign-in functions are never uploaded.
# Optional secrets: ADMIN_PASSWORD and ADMIN_GITHUB_TOKEN are copied into the Worker's
# encrypted secrets so /admin can sign in and drive the firmware workflows.
name: keys deploy
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['apps/keys-ryong-runtime/**', 'experiments/runtime-client/**', '.github/workflows/keys-deploy.yml']
  workflow_dispatch:
env:
  DOMAIN: keys.ryong.com
  ZONE: ryong.com
permissions:
  contents: read
concurrency:
  group: keys-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check that the owner enabled deployment
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::keys deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Build pinned custom Studio client
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          bash experiments/runtime-client/prepare.sh "$GITHUB_WORKSPACE/vendor/runtime-studio-client"
      - name: Build development web app
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/keys-ryong-runtime
        run: |
          npm ci
          mkdir -p src/data
          [ -f src/data/release-data.json ] || echo '{"tag_name":"","assets":[]}' > src/data/release-data.json
          npx tsc -p tsconfig.runtime.json
          npx vite build --config vite.runtime.config.ts --outDir dist-runtime
          # Open to search engines (owner's choice, 2026-11-04); only /admin stays out.
          printf 'User-agent: *\nDisallow: /admin\n' > dist-runtime/robots.txt
          printf '/admin*\n  X-Robots-Tag: noindex\n' > dist-runtime/_headers
      - name: Deploy to the Worker (static assets + admin API)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          # Only the site, the worker and the admin API go up (never the app's sign-in functions/).
          app=apps/keys-ryong-runtime; d=/tmp/worker
          mkdir -p $d && cp -r $app/dist-runtime $d/site && cp -r $app/worker $app/admin-functions $app/wrangler.jsonc $d/
          cd $d
          npx --yes wrangler@4.40.0 deploy
          # Secrets live encrypted on the Worker, never in the uploaded files.
          python3 - > secrets.json <<'PY'
          import json, os
          print(json.dumps({k: os.environ[k] for k in ("ADMIN_PASSWORD", "ADMIN_GITHUB_TOKEN") if os.environ.get(k)}))
          PY
          [ "$(cat secrets.json)" != "{}" ] && npx --yes wrangler@4.40.0 secret bulk secrets.json >/dev/null && echo "admin secrets set"
          rm -f secrets.json
          echo "### keys deployed (Worker)" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`keys\` · workers.dev URL in the Cloudflare dashboard · https://$DOMAIN once attached" >> "$GITHUB_STEP_SUMMARY"
