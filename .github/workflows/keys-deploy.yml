# Deploys the web app (and its /admin) to the Cloudflare Pages project ryong-keys, served at
# keys.ryong.com (replaced the original Keys site and keysbeta.ryong.com on 2026-11-04; the
# one-time move is keys-cutover.yml). Does nothing until the Cloudflare repository secrets exist.
# Uploads the static app plus ONLY the /api/admin functions (admin-functions/); the
# original app's GitHub sign-in functions are never uploaded.
# Optional secrets: ADMIN_PASSWORD and ADMIN_GITHUB_TOKEN are copied into the Pages
# project's encrypted secrets so /admin can sign in and drive the firmware workflows.
name: keys deploy
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['apps/keys-ryong-runtime/**', 'experiments/runtime-client/**', '.github/workflows/keys-deploy.yml']
  workflow_dispatch:
env:
  PROJECT: ryong-keys
  DOMAIN: keys.ryong.com
  ZONE: ryong.com
permissions:
  contents: read
concurrency:
  group: keys-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check that the owner enabled deployment
        id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT"
          else echo "enabled=false" >> "$GITHUB_OUTPUT"; echo "::notice::keys deploy skipped: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set."; fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.enabled == 'true'
        with:
          node-version: '22'
      - name: Build pinned custom Studio client
        if: steps.gate.outputs.enabled == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y protobuf-compiler
          bash experiments/runtime-client/prepare.sh "$GITHUB_WORKSPACE/vendor/runtime-studio-client"
      - name: Build development web app
        if: steps.gate.outputs.enabled == 'true'
        working-directory: apps/keys-ryong-runtime
        run: |
          npm ci
          mkdir -p src/data
          [ -f src/data/release-data.json ] || echo '{"tag_name":"","assets":[]}' > src/data/release-data.json
          npx tsc -p tsconfig.runtime.json
          npx vite build --config vite.runtime.config.ts --outDir dist-runtime
          # Open to search engines (owner's choice, 2026-11-04); only /admin stays out.
          printf 'User-agent: *\nDisallow: /admin\n' > dist-runtime/robots.txt
          printf '/admin*\n  X-Robots-Tag: noindex\n' > dist-runtime/_headers
      - name: Deploy to the separate Pages project
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          # Run from a folder holding only the site and the admin API, so the app's sign-in functions/ are never uploaded.
          mkdir -p /tmp/deploy && cp -r apps/keys-ryong-runtime/dist-runtime /tmp/deploy/site
          cp -r apps/keys-ryong-runtime/admin-functions /tmp/deploy/functions && rm -f /tmp/deploy/functions/tsconfig.json
          cd /tmp/deploy
          npx --yes wrangler@3.114.17 pages project list | grep -q " $PROJECT " || npx --yes wrangler@3.114.17 pages project create "$PROJECT" --production-branch=main
          # Admin secrets live encrypted in the Pages project; they are never part of the uploaded files.
          for name in ADMIN_PASSWORD ADMIN_GITHUB_TOKEN; do
            if [ -n "${!name}" ]; then printf '%s' "${!name}" | npx --yes wrangler@3.114.17 pages secret put "$name" --project-name="$PROJECT" >/dev/null && echo "$name set"; else echo "::notice::$name not set; /admin stays closed until it is."; fi
          done
          npx --yes wrangler@3.114.17 pages deploy site --project-name="$PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-dirty=true
          echo "### keys deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Pages project: \`$PROJECT\` · https://$PROJECT.pages.dev · https://$DOMAIN" >> "$GITHUB_STEP_SUMMARY"
      - name: Keep keys.ryong.com attached (after the one-time move)
        if: steps.gate.outputs.enabled == 'true'
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -u
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          base="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/pages/projects/$PROJECT/domains"
          if api "$base/$DOMAIN" | grep -q '"success":true'; then echo "$DOMAIN is attached to $PROJECT."
          else echo "Could not confirm $DOMAIN with this token (it was attached in the Cloudflare dashboard on 2026-11-04)."; fi
