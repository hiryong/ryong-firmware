name: Host core tests
on:
  push:
    paths:
      - 'modules/**'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/host-tests.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'scripts/**'
      - 'CMakeLists.txt'
      - '.github/workflows/host-tests.yml'
permissions:
  contents: read
jobs:
  gcc-and-clang:
    name: "${{ matrix.compiler }} host tests"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_BUILD_TYPE=Debug
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Build isolation and security tests
        env:
          CC: ${{ matrix.compiler }}
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Test
        run: ctest --test-dir build --output-on-failure

