# Bluetooth simulation (BabbleSim) of the patched ZMK: the keyboard firmware and simulated
# computers run together on a simulated radio. Catches hangs, crashes and wrong connection
# behaviour before anything is flashed on a real keyboard. Nothing is published.
#  - ZMK's own profile and security scenarios run against our slot code (one address per slot),
#    each simulated computer judged against ZMK's expected outcome
#  - upgrade: a keyboard paired under older firmware boots this one on the same flash
name: BLE simulation
on:
  workflow_dispatch:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['third_party/zmk/**', 'tests/ble-sim/**', '.github/workflows/ble-sim.yml']
permissions:
  contents: read
concurrency:
  group: ble-sim
  cancel-in-progress: true
jobs:
  sim:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      image: docker.io/zmkfirmware/zmk-build-arm:4.1
    steps:
      - uses: actions/checkout@v4
        with:
          path: ryong
          fetch-depth: 0   # the upgrade test builds an older patch from history
      - name: Official ZMK at the pinned commit + our patch
        run: |
          set -eu
          ZMK=$(python3 -c "import json;print(json.load(open('ryong/third_party/zmk/base.json'))['zmk'])")
          git clone --filter=blob:none https://github.com/zmkfirmware/zmk.git zmk
          git -C zmk checkout -q "$ZMK"
          git -C zmk apply --whitespace=nowarn "$GITHUB_WORKSPACE/ryong/third_party/zmk/zmk-custom-studio.patch"
          echo "ZMK $ZMK + Ryong patch applied"
      - uses: actions/cache@v4
        with:
          path: |
            zmk/modules/
            zmk/tools/
            zmk/zephyr/
          key: ble-sim-${{ hashFiles('zmk/app/west.yml') }}-v1
      - name: West workspace with BabbleSim
        working-directory: zmk
        run: |
          [ -d .west ] || west init -l app
          west config manifest.group-filter -- +babblesim
          west update --fetch-opt=--filter=tree:0
          west zephyr-export
      - name: Build BabbleSim
        working-directory: zmk/tools/bsim
        run: make everything -j4 > /dev/null
      - name: ZMK's Bluetooth scenarios against our slot code (src/ble_slots.c)
        working-directory: zmk/app
        shell: bash
        env:
          BSIM_COMPONENTS_PATH: ${{ github.workspace }}/zmk/tools/bsim/components
          BSIM_OUT_PATH: ${{ github.workspace }}/zmk/tools/bsim
        run: |
          set -o pipefail
          mkdir -p build/tests
          ./run-ble-test.sh tests/ble/profiles > /dev/null 2>&1 || true
          BLE_TESTS_NO_CENTRAL_BUILD=y ./run-ble-test.sh tests/ble/security > /dev/null 2>&1 || true
          # addresses differ from ZMK's snapshots by design: judge each computer's outcome instead
          python3 "$GITHUB_WORKSPACE/ryong/tests/ble-sim/check_identity_runs.py" build/tests/ble/profiles tests/ble/profiles tests/ble/profiles | tee -a "$GITHUB_STEP_SUMMARY"
          python3 "$GITHUB_WORKSPACE/ryong/tests/ble-sim/check_identity_runs.py" build/tests/ble/security tests/ble/security tests/ble/security | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upgrade a keyboard with paired slots (same flash, old firmware then this one)
        working-directory: zmk/app
        shell: bash
        env:
          BSIM_COMPONENTS_PATH: ${{ github.workspace }}/zmk/tools/bsim/components
          BSIM_OUT_PATH: ${{ github.workspace }}/zmk/tools/bsim
        run: |
          set -o pipefail
          R="$GITHUB_WORKSPACE/ryong"; M="$R/tests/ble-sim/migration"
          # official ZMK (one shared address), and the build that froze keyboards (76a1944)
          git -C .. worktree add -q --detach ../zmk-official HEAD
          git -C .. worktree add -q --detach ../zmk-76a1944 HEAD
          git -C "$R" show 76a1944:third_party/zmk/zmk-custom-studio.patch > /tmp/76a1944.patch
          git -C ../../zmk-76a1944 apply --whitespace=nowarn /tmp/76a1944.patch
          "$R/tests/ble-sim/run_migration.sh" "$M" from-official old ../../zmk-official/app . | tee -a "$GITHUB_STEP_SUMMARY"
          # 76a1944 itself stops at power-up once settings are stored (HCI command timeout while its
          # start-up ran inside settings_load): whatever it left behind, this firmware must start
          REQUIRE_OLD_PAIRED=0 "$R/tests/ble-sim/run_migration.sh" "$M" from-76a1944 old-ids ../../zmk-76a1944/app . | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ble-sim-logs
          path: |
            zmk/app/build/tests/**/*.log
