name: BT60 v2 test fixture compile
on:
  push:
    branches: [dev/keys-ryong-runtime]
    paths: ['hardware/test-fixtures/bt60-v2/**', 'experiments/bt60-runtime/**', 'scripts/prepare_bt60.py', 'scripts/vendor_zmk.py', 'third_party/zmk/**', 'third_party/zmk-modules/**', 'scripts/runtime_defaults.py', 'scripts/secure_runtime_rpc.py', 'modules/**', 'experiments/host-layout/**', 'experiments/dya-runtime/**', '.github/workflows/bt60-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, runtime, host-layout]
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          EXTRA=()
          if [ "${{ matrix.variant }}" = host-layout ]; then EXTRA=(--host-layout); fi
          python3 scripts/prepare_bt60.py /tmp/bt60-build "${EXTRA[@]}"
      - uses: actions/cache@v4
        with:
          path: |
            /tmp/bt60-build/zmk
            /tmp/bt60-build/zephyr
            /tmp/bt60-build/modules
            /tmp/bt60-build/tools
            /tmp/bt60-build/bootloader
          key: bt60-deps-${{ runner.os }}-${{ hashFiles('docs/build-evidence/34a0f3d-baseline-west.yml', 'third_party/zmk/base.json', 'third_party/zmk-modules/**') }}
      - name: Resolve fully pinned test dependencies
        working-directory: /tmp/bt60-build
        run: |
          west init -l config
          west update --fetch-opt=--filter=tree:0
          west forall -c 'git restore --source=HEAD --worktree --staged .'
          west zephyr-export
          python3 "$GITHUB_WORKSPACE/scripts/vendor_zmk.py" apply .
      - name: Secure runtime RPC
        if: matrix.variant != 'baseline'
        run: python3 scripts/secure_runtime_rpc.py /tmp/bt60-build
      - name: Compile BT60 only
        shell: bash
        working-directory: /tmp/bt60-build
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          EXTRA=()
          if [ "$VARIANT" != baseline ]; then
            EXTRA=("-DZMK_EXTRA_MODULES=/tmp/bt60-build/bt60-module;$GITHUB_WORKSPACE/modules/ryong-holdtap" "-DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/experiments/dya-runtime/ryong60-runtime.conf" "-DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/experiments/bt60-runtime/runtime.overlay")
          fi
          if [ "$VARIANT" = host-layout ]; then
            EXTRA=("-DZMK_EXTRA_MODULES=/tmp/bt60-build/bt60-module;$GITHUB_WORKSPACE/modules/ryong-holdtap;$GITHUB_WORKSPACE/modules/ryong-host-layout;$GITHUB_WORKSPACE/modules/ryong-update;$GITHUB_WORKSPACE/modules/ryong-ble-profiles;$GITHUB_WORKSPACE/modules/ryong-runtime-settings;$GITHUB_WORKSPACE/modules/ryong-named-macro" "-DEXTRA_CONF_FILE=$GITHUB_WORKSPACE/experiments/dya-runtime/ryong60-runtime.conf;$GITHUB_WORKSPACE/experiments/host-layout/host-layout.conf;$GITHUB_WORKSPACE/experiments/host-layout/update.conf;$GITHUB_WORKSPACE/experiments/host-layout/ble-profiles.conf;$GITHUB_WORKSPACE/experiments/host-layout/runtime-settings.conf;$GITHUB_WORKSPACE/experiments/bt60-runtime/lights.conf;$GITHUB_WORKSPACE/experiments/bt60-runtime/ble-dfu.conf" "-DEXTRA_DTC_OVERLAY_FILE=$GITHUB_WORKSPACE/experiments/bt60-runtime/runtime.overlay;$GITHUB_WORKSPACE/experiments/host-layout/host-layout.overlay;/tmp/bt60-build/runtime-defaults.overlay;$GITHUB_WORKSPACE/experiments/bt60-runtime/ble-dfu.overlay")
          fi
          if [ "$VARIANT" = host-layout ]; then EXTRA+=("-DCONFIG_RYONG_UPDATE_BUILD_ID=\"${GITHUB_SHA}\""); fi
          if [ "$VARIANT" = host-layout ]; then python3 "$GITHUB_WORKSPACE/scripts/runtime_defaults.py" config/ryong-behaviors.dtsi runtime-defaults.overlay config/ryong-behaviors.json; fi
          west build -s zmk/app -d build -b bt60//zmk -S studio-rpc-usb-uart -- -DCONFIG_ZMK_STUDIO=y -DZMK_CONFIG=/tmp/bt60-build/config -DZMK_EXTRA_MODULES=/tmp/bt60-build/bt60-module "${EXTRA[@]}"
      - name: Diagnostic reports only
        if: always()
        working-directory: /tmp/bt60-build
        run: |
          mkdir -p reports
          for f in .config zephyr.dts zmk.map; do
            if [ -f "build/zephyr/$f" ]; then cp "build/zephyr/$f" "reports/${f#.}"; fi
          done
          if [ -f build/zephyr/zmk.elf ]; then
            west build -d build -t rom_report > reports/rom.txt
            west build -d build -t ram_report > reports/ram.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bt60-diagnostic-${{ matrix.variant }}
          path: /tmp/bt60-build/reports
# Never upload installable images until the actual unit/recovery path is verified.

